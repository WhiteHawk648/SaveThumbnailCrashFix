[General]
; Master toggle for the fix. 1 = enabled (recommended), 0 = disabled.
bEnabled = 1

; Enable logging to SaveThumbnailCrashFix.log in the same directory.
; Records initialization status and whenever a null-pointer save crash is intercepted.
bEnableLogging = 1

; Show a brief in-game corner HUD notification (Vault-Boy) when a crash is prevented.
; 0 = Silent (recommended for pure immersion), 1 = Show in-game HUD alert.
bShowInGameNotification = 0

; Duration in seconds for the corner HUD alert if bShowInGameNotification is enabled.
fNotificationDuration = 3.0
